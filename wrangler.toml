# Cloudflare Pages config.
#
#   web/        -> static site (index.html, app.js, style.css, data/*.json)
#   functions/  -> /api/live, which proxies the NTA GTFS-Realtime feed
#
# The API key is NOT in this file. Set it once as an encrypted secret:
#   npx wrangler pages secret put NTA_API_KEY
#
# Deploy:
#   npx wrangler pages deploy web
#
# Or connect the GitHub repo in the Cloudflare dashboard and it rebuilds on
# every push to main, with "Build output directory" set to `web`.

name = "dublin-bus-82"
pages_build_output_dir = "web"
compatibility_date = "2026-10-20"
